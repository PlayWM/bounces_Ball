<script>
// =================================================================
// 1. 기본 설정 및 전역 유틸
// =================================================================
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const nameInputOverlay = document.getElementById("name-input-overlay");
const nameInput = document.getElementById("name-input");

const LOGICAL_WIDTH = 450;
const LOGICAL_HEIGHT = 800;
const VERSION_STR = "v20261011.TwinFixFinal";
const FIREBASE_URL = "https://flywm-d0b39-default-rtdb.asia-southeast1.firebasedatabase.app/leaderboard.json";
const FONT_FAMILY = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Malgun Gothic', sans-serif";

canvas.width = LOGICAL_WIDTH;
canvas.height = LOGICAL_HEIGHT;

function sanitizeText(str) {
  if (!str) return "Unknown";
  return String(str).replace(/[^\w\s\uAC00-\uD7A3.-]/gi, '').trim().substring(0, 10) || "Unknown";
}

function drawRoundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

function drawStarShape(c, cx, cy, spikes, outerRadius, innerRadius) {
  let rot = Math.PI / 2 * 3;
  let step = Math.PI / spikes;
  c.beginPath();
  c.moveTo(cx, cy - outerRadius);
  for (let i = 0; i < spikes; i++) {
    x = cx + Math.cos(rot) * outerRadius;
    y = cy + Math.sin(rot) * outerRadius;
    c.lineTo(x, y);
    rot += step;
    x = cx + Math.cos(rot) * innerRadius;
    y = cy + Math.sin(rot) * innerRadius;
    c.lineTo(x, y);
    rot += step;
  }
  c.lineTo(cx, cy - outerRadius);
  c.closePath();
}

let nebulaOffsetTime = 0;
function drawDynamicDeepSpaceBackground(c, dt) {
  nebulaOffsetTime += dt * 3.0;

  const bgGrad = c.createLinearGradient(0, 0, 0, LOGICAL_HEIGHT);
  bgGrad.addColorStop(0, "#03020c");
  bgGrad.addColorStop(0.5, "#060718");
  bgGrad.addColorStop(1, "#02030d");
  c.fillStyle = bgGrad;
  c.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

  const n1x = 100 + Math.sin(nebulaOffsetTime * 0.45) * 65;
  const n1y = 210 + Math.cos(nebulaOffsetTime * 0.35) * 45;
  const neb1 = c.createRadialGradient(n1x, n1y, 15, n1x, n1y, 225);
  neb1.addColorStop(0, "rgba(195, 220, 255, 0.22)");
  neb1.addColorStop(0.45, "rgba(105, 50, 185, 0.14)");
  neb1.addColorStop(1, "rgba(0, 0, 0, 0)");
  c.fillStyle = neb1;
  c.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

  const n2x = 330 + Math.cos(nebulaOffsetTime * 0.4) * 60;
  const n2y = 620 + Math.sin(nebulaOffsetTime * 0.5) * 55;
  const neb2 = c.createRadialGradient(n2x, n2y, 20, n2x, n2y, 245);
  neb2.addColorStop(0, "rgba(215, 240, 255, 0.18)");
  neb2.addColorStop(0.5, "rgba(0, 195, 245, 0.12)");
  neb2.addColorStop(1, "rgba(0, 0, 0, 0)");
  c.fillStyle = neb2;
  c.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

  stars.forEach(s => { s.update(); s.draw(); });
}

// =================================================================
// 2. 국가 및 리더보드
// =================================================================
let userCountry = "Vietnam";
let sessionSecurityKey = Math.random().toString(36).substring(2, 10);
let sessionStartTime = performance.now();

let top10List = [];
function fetchTop10() {
  try {
    fetch(FIREBASE_URL)
      .then(r => r.json())
      .then(data => {
        if (data) {
          const items = Object.values(data).filter(v => v && v.name && v.score !== undefined);
          items.sort((a, b) => b.score - a.score);
          top10List = items.slice(0, 10).map(v => ({
            name: sanitizeText(v.name),
            score: Math.floor(Number(v.score) || 0),
            country: sanitizeText(v.country) || "Global"
          }));
        }
      }).catch(() => {});
  } catch(e){}
}
fetchTop10();

function uploadScore(name, finalScore) {
  const cleanName = sanitizeText(name);
  if (!cleanName || cleanName === "Unknown") return;
  const durationSec = Math.max(1, (performance.now() - sessionStartTime) / 1000);
  if (finalScore < 0 || finalScore > durationSec * 60 + 500) return;

  try {
    fetch(FIREBASE_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: cleanName,
        score: Math.floor(finalScore),
        country: sanitizeText(userCountry),
        token: sessionSecurityKey,
        time: Date.now() / 1000
      })
    }).then(() => fetchTop10()).catch(() => {});
  } catch(e){}
}

// =================================================================
// 3. Web Audio 사운드 엔진
// =================================================================
let audioCtx = null;
let bgmInterval = null;
let bgmStep = 0;
let currentBgmMode = "select";
let inGameBgmTrack = 0;
let selectBgmTrack = 0;
let isPageVisible = true;

function initAudio() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      startBGMEngine();
    }
    if (audioCtx && audioCtx.state === 'suspended' && isPageVisible) {
      audioCtx.resume().catch(() => {});
    }
  } catch(e){}
}

document.addEventListener("visibilitychange", () => {
  isPageVisible = (document.visibilityState === "visible");
  try {
    if (!isPageVisible && audioCtx && audioCtx.state === "running") audioCtx.suspend();
    else if (isPageVisible && audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  } catch(e){}
});
window.addEventListener("blur", () => {
  try { if (audioCtx && audioCtx.state === "running") audioCtx.suspend(); } catch(e){}
});
window.addEventListener("focus", () => {
  try { if (audioCtx && audioCtx.state === "suspended" && isPageVisible) audioCtx.resume(); } catch(e){}
});

function playTone(freq, duration, type="sine", sweep=0, vol=0.075) {
  if (!audioCtx || !isPageVisible || audioCtx.state !== "running") return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    const now = audioCtx.currentTime;
    osc.frequency.setValueAtTime(freq, now);
    if (sweep !== 0) osc.frequency.linearRampToValueAtTime(freq + sweep, now + duration);
    gain.gain.setValueAtTime(vol * 0.5, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + duration);
  } catch(e){}
}

function playMeteorWarningSound() {
  if (!audioCtx || !isPageVisible || audioCtx.state !== "running") return;
  try {
    const now = audioCtx.currentTime;
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc1.type = "sawtooth"; osc2.type = "square";
    osc1.frequency.setValueAtTime(340, now); osc1.frequency.linearRampToValueAtTime(130, now + 0.38);
    osc2.frequency.setValueAtTime(345, now); osc2.frequency.linearRampToValueAtTime(135, now + 0.38);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
    osc1.connect(gain); osc2.connect(gain);
    gain.connect(audioCtx.destination);
    osc1.start(now); osc2.start(now);
    osc1.stop(now + 0.38); osc2.stop(now + 0.38);
  } catch(e){}
}

function playExplosionSound() {
  if (!audioCtx || !isPageVisible || audioCtx.state !== "running") return;
  try {
    const now = audioCtx.currentTime;
    const dur = 0.22;
    const buf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * dur), audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < buf.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / buf.length);
    const src = audioCtx.createBufferSource();
    const gain = audioCtx.createGain();
    src.buffer = buf;
    gain.gain.setValueAtTime(0.10, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    src.connect(gain); gain.connect(audioCtx.destination);
    src.start(now);
  } catch(e){}
}

function setSelectScreenMode() {
  currentBgmMode = "select";
  selectBgmTrack = Math.floor(Math.random() * 3);
  bgmStep = 0;
}

function startBGMEngine() {
  if (bgmInterval) return;

  const selectTracks = [
    [261.63, 293.66, 329.63, 392.00, 329.63, 392.00, 440.00, 523.25],
    [220.00, 261.63, 293.66, 329.63, 392.00, 440.00, 493.88, 523.25],
    [196.00, 246.94, 293.66, 329.63, 392.00, 440.00, 587.33, 659.25]
  ];

  const inGameTrack1 = [130.81, 164.81, 196.00, 246.94, 261.63, 329.63];
  const inGameTrack2 = [146.83, 174.61, 220.00, 261.63, 293.66, 349.23];
  const inGameTrack3 = [110.00, 130.81, 146.83, 164.81, 220.00, 261.63];

  bgmInterval = setInterval(() => {
    if (!audioCtx || audioCtx.state !== 'running' || !isPageVisible) return;
    const now = audioCtx.currentTime;

    if (currentBgmMode === "select") {
      const activeMelody = selectTracks[selectBgmTrack % 3];
      if (bgmStep % 4 === 0) {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = "sine";
        const f = activeMelody[(bgmStep / 4) % activeMelody.length];
        osc.frequency.setValueAtTime(f, now);
        g.gain.setValueAtTime(0.026, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.45);
      }
    } else {
      let activeTrack = inGameBgmTrack === 0 ? inGameTrack1 : (inGameBgmTrack === 1 ? inGameTrack2 : inGameTrack3);
      if (bgmStep % 2 === 0) {
        const bOsc = audioCtx.createOscillator();
        const bG = audioCtx.createGain();
        bOsc.type = inGameBgmTrack === 1 ? "square" : "sawtooth";
        bOsc.frequency.setValueAtTime(activeTrack[0] / 2, now);
        bG.gain.setValueAtTime(0.0112, now);
        bG.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        bOsc.connect(bG); bG.connect(audioCtx.destination);
        bOsc.start(now); bOsc.stop(now + 0.25);
      }
      const mOsc = audioCtx.createOscillator();
      const mG = audioCtx.createGain();
      mOsc.type = "sine";
      const mNote = activeTrack[(bgmStep * 3 + inGameBgmTrack) % activeTrack.length];
      mOsc.frequency.setValueAtTime(mNote, now);
      mG.gain.setValueAtTime(0.0062, now);
      mG.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      mOsc.connect(mG); mG.connect(audioCtx.destination);
      mOsc.start(now); mOsc.stop(now + 0.16);
    }
    bgmStep = (bgmStep + 1) % 80;
  }, 125);
}

// =================================================================
// 4. 게임 데이터 및 벡터 렌더러
// =================================================================
const CONFIG = {
  BASE_PLAYER_SPEED: 10.5,
  BASE_FIRE_INTERVAL: 0.324,
  FIRE_RATE_REDUCTION: 0.05,
  MIN_SPAWN_INTERVAL: 0.05,
  MAX_SPAWN_INTERVAL: 0.30,
  BASE_ENEMY_SPEED: 3.6,
  LASER_WEAPON_INTERVAL: 1.0,
  LASER_BEAM_LINGER_TIME: 0.1,
  CLONE_SHIP_DURATION: 30.0,
  MAX_SKILL_GAUGE: 100.0,
  BASE_GAUGE_PER_KILL: 2.6
};

const GALAXY_STARS = Array.from({ length: 112 }, (_, i) => ({
  angOffset: Math.random() * Math.PI * 2,
  dist: Math.random() * 125,
  size: [0.8, 1.4, 2.0, 2.8][i % 4],
  speedMult: 0.6 + Math.random() * 0.8
}));

function drawGalaxyBackground(c, curTime) {
  c.save();
  const gx = LOGICAL_WIDTH * 0.5;
  const gy = LOGICAL_HEIGHT * 0.5;

  c.save();
  c.translate(gx, gy);
  c.scale(1.5, 1.5);
  c.rotate(curTime * 0.06);

  const gGrad1 = c.createRadialGradient(0, 0, 10, 0, 0, 170);
  gGrad1.addColorStop(0, "rgba(255, 240, 255, 0.45)");
  gGrad1.addColorStop(0.2, "rgba(160, 80, 255, 0.30)");
  gGrad1.addColorStop(0.5, "rgba(0, 210, 255, 0.20)");
  gGrad1.addColorStop(0.8, "rgba(10, 20, 70, 0.10)");
  gGrad1.addColorStop(1, "rgba(0, 0, 0, 0)");
  c.fillStyle = gGrad1;
  c.beginPath(); c.arc(0, 0, 170, 0, Math.PI * 2); c.fill();

  c.save();
  c.scale(2.3, 0.6);
  const armGrad = c.createRadialGradient(0, 0, 5, 0, 0, 135);
  armGrad.addColorStop(0, "rgba(255, 255, 255, 0.7)");
  armGrad.addColorStop(0.25, "rgba(190, 130, 255, 0.35)");
  armGrad.addColorStop(0.65, "rgba(0, 245, 255, 0.18)");
  armGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
  c.fillStyle = armGrad;
  c.beginPath(); c.arc(0, 0, 135, 0, Math.PI * 2); c.fill();
  c.restore();

  GALAXY_STARS.forEach((st, idx) => {
    const curAng = st.angOffset + curTime * 0.15 * st.speedMult;
    const sx = Math.cos(curAng) * st.dist;
    const sy = Math.sin(curAng) * (st.dist * 0.42);
    const pulse = Math.sin(curTime * 4.0 + idx) * 0.35 + 0.65;
    c.fillStyle = `rgba(255, 255, 255, ${pulse})`;
    c.beginPath();
    c.arc(sx, sy, st.size * 0.5, 0, Math.PI * 2);
    c.fill();
  });

  c.restore();
  c.restore();
}

function drawWingMissilePod(c, mx, my, isFlash=false) {
  c.save();
  c.translate(mx, my);
  c.fillStyle = "#1e293b";
  c.fillRect(-2, -5, 4, 10);
  c.fillStyle = "#ff007f";
  c.beginPath();
  c.moveTo(0, -9); c.lineTo(2, -5); c.lineTo(-2, -5);
  c.closePath(); c.fill();
  c.fillStyle = "#00f5ff";
  c.fillRect(-1.5, 0, 3, 1.5);
  c.fillStyle = "#ffd700";
  c.beginPath();
  c.moveTo(-2, 5); c.lineTo(0, 8); c.lineTo(2, 5);
  c.closePath(); c.fill();

  if (isFlash) {
    const fGrad = c.createRadialGradient(0, -11, 1, 0, -11, 8);
    fGrad.addColorStop(0, "#ffffff");
    fGrad.addColorStop(0.5, "#ff007f");
    fGrad.addColorStop(1, "rgba(255, 0, 127, 0)");
    c.fillStyle = fGrad;
    c.beginPath(); c.arc(0, -11, 8, 0, Math.PI * 2); c.fill();
  }
  c.restore();
}

function drawVectorPlayer(c, type, color, scale = 1.0, flameHeight = 0, isMissileFlash=false) {
  c.save();
  c.scale(scale, scale);
  c.shadowColor = color;
  c.shadowBlur = 6;
  c.lineJoin = "round";
  c.lineCap = "round";

  const flH = Math.max(5, 14 + Math.random() * 8 + (Number.isFinite(flameHeight) ? flameHeight : 0));
  const drawThruster = (tx, ty, tw) => {
    c.fillStyle = "#1e293b";
    c.fillRect(tx - tw / 2, ty, tw, 4);
    c.strokeStyle = "#475569";
    c.lineWidth = 1;
    c.strokeRect(tx - tw / 2, ty, tw, 4);

    const safeGradY2 = Math.min(LOGICAL_HEIGHT, ty + 4 + flH);
    const fg = c.createLinearGradient(tx, ty + 4, tx, safeGradY2);
    fg.addColorStop(0, "#ffffff");
    fg.addColorStop(0.25, color || "#00ff66");
    fg.addColorStop(1, "rgba(0,0,0,0)");
    c.fillStyle = fg;
    c.beginPath();
    c.moveTo(tx - tw / 2 + 1, ty + 4);
    c.lineTo(tx, safeGradY2);
    c.lineTo(tx + tw / 2 - 1, ty + 4);
    c.closePath();
    c.fill();
  };
  if (type === 2) { drawThruster(-11, 14, 6); drawThruster(11, 14, 6); }
  else { drawThruster(-6, 13, 5); drawThruster(6, 13, 5); }

  const darkHull = "#080d1a";
  const midHull = "#131e33";
  const lightHull = "#1c2c4a";

  if (type === 0) {
    c.fillStyle = darkHull; c.strokeStyle = color; c.lineWidth = 1.5;
    c.beginPath();
    c.moveTo(0, -25); c.lineTo(7, -10); c.lineTo(24, 10); c.lineTo(21, 16);
    c.lineTo(12, 13); c.lineTo(0, 18); c.lineTo(-12, 13); c.lineTo(-21, 16);
    c.lineTo(-24, 10); c.lineTo(-7, -10);
    c.closePath(); c.fill(); c.stroke();

    c.fillStyle = midHull;
    c.beginPath();
    c.moveTo(0, -21); c.lineTo(5, -8); c.lineTo(16, 8); c.lineTo(8, 10);
    c.lineTo(0, 14); c.lineTo(-8, 10); c.lineTo(-16, 8); c.lineTo(-5, -8);
    c.closePath(); c.fill();

    c.strokeStyle = "rgba(255, 255, 255, 0.45)"; c.lineWidth = 0.8;
    c.beginPath();
    c.moveTo(7, -8); c.lineTo(19, 12); c.moveTo(-7, -8); c.lineTo(-19, 12);
    c.stroke();

    c.fillStyle = lightHull; c.fillRect(-4, 0, 2, 7); c.fillRect(2, 0, 2, 7);
    c.fillStyle = "#00f5ff";
    c.beginPath();
    c.moveTo(0, -18); c.lineTo(3.5, -6); c.lineTo(0, 2); c.lineTo(-3.5, -6);
    c.closePath(); c.fill();
    c.strokeStyle = "#ffffff"; c.lineWidth = 1; c.stroke();

    drawWingMissilePod(c, -24, 10, isMissileFlash);
    drawWingMissilePod(c, 24, 10, isMissileFlash);

  } else if (type === 1) {
    c.fillStyle = darkHull; c.strokeStyle = color; c.lineWidth = 1.8;
    c.beginPath();
    c.moveTo(0, -23); c.lineTo(14, -12); c.lineTo(24, -2); c.lineTo(22, 16);
    c.lineTo(11, 14); c.lineTo(0, 19); c.lineTo(-11, 14); c.lineTo(-22, 16);
    c.lineTo(-24, -2); c.lineTo(-14, -12);
    c.closePath(); c.fill(); c.stroke();

    c.fillStyle = "#334155";
    c.fillRect(-16, -18, 3.5, 14); c.fillRect(12.5, -18, 3.5, 14);
    c.fillStyle = midHull;
    c.beginPath();
    c.moveTo(0, -18); c.lineTo(8, -6); c.lineTo(8, 8); c.lineTo(0, 13);
    c.lineTo(-8, 8); c.lineTo(-8, -6);
    c.closePath(); c.fill();
    c.fillStyle = "#ff2244";
    c.beginPath(); c.arc(0, -10, 4, 0, Math.PI * 2); c.fill();

    drawWingMissilePod(c, -23, 14, isMissileFlash);
    drawWingMissilePod(c, 23, 14, isMissileFlash);

  } else if (type === 2) {
    const drawFuselage = (fx) => {
      c.fillStyle = darkHull; c.strokeStyle = color; c.lineWidth = 1.5;
      c.beginPath();
      c.moveTo(fx, -26); c.lineTo(fx + 5, -10); c.lineTo(fx + 6, 12);
      c.lineTo(fx - 1, 15); c.lineTo(fx - 6, 12); c.lineTo(fx - 5, -10);
      c.closePath(); c.fill(); c.stroke();
      c.fillStyle = midHull; c.fillRect(fx - 3, -12, 6, 18);
    };
    drawFuselage(-11); drawFuselage(11);
    c.fillStyle = "#1e293b"; c.fillRect(-6, -4, 12, 14);
    c.fillStyle = "#00ff66"; c.fillRect(-2, 0, 4, 6);

    drawWingMissilePod(c, -17, 10, isMissileFlash);
    drawWingMissilePod(c, 17, 10, isMissileFlash);

  } else if (type === 4) {
    c.fillStyle = "#181305"; c.strokeStyle = color; c.lineWidth = 1.8;
    c.beginPath();
    c.moveTo(0, -28); c.lineTo(10, -14); c.lineTo(26, 6); c.lineTo(18, 18);
    c.lineTo(8, 12); c.lineTo(0, 20); c.lineTo(-8, 12); c.lineTo(-18, 18);
    c.lineTo(-26, 6); c.lineTo(-10, -14);
    c.closePath(); c.fill(); c.stroke();

    c.fillStyle = "#2d240c";
    c.beginPath();
    c.moveTo(0, -20); c.lineTo(8, -8); c.lineTo(17, 8); c.lineTo(6, 9);
    c.lineTo(0, 14); c.lineTo(-6, 9); c.lineTo(-17, 8); c.lineTo(-8, -8);
    c.closePath(); c.fill();
    c.fillStyle = "#ffd700";

const ROCK_PALETTES = [
  { fill: "#1a1c23", stroke: "#64748b", glow: "#94a3b8" },
  { fill: "#262626", stroke: "#737373", glow: "#a3a3a3" },
  { fill: "#1e222a", stroke: "#475569", glow: "#64748b" },
  { fill: "#202024", stroke: "#52525b", glow: "#71717a" },
  { fill: "#18181b", stroke: "#3f3f46", glow: "#52525b" }
];

function drawVectorEliteAsteroid(c, rockId, rotDir, colorIdx, curTime) {
  c.save();
  const rotAngle = (curTime * ((Math.PI * 2) / 1.5)) * (rotDir || 1);
  c.rotate(rotAngle);
  c.scale(0.6, 0.6);

  const theme = ROCK_PALETTES[(colorIdx || 0) % ROCK_PALETTES.length];
  c.fillStyle = theme.fill;
  c.strokeStyle = theme.stroke;
  c.lineWidth = 3.5;
  c.shadowColor = theme.glow;
  c.shadowBlur = 14;

  const shapeType = (rockId || 0) % 3;
  c.beginPath();
  if (shapeType === 0) {
    c.ellipse(0, 0, 24, 31, 0, 0, Math.PI * 2);
  } else if (shapeType === 1) {
    const pts = [[0, -32], [27, -16], [27, 16], [0, 32], [-27, 16], [-27, -16]];
    c.moveTo((pts[0][0] + pts[5][0]) / 2, (pts[0][1] + pts[5][1]) / 2);
    for (let i = 0; i < 6; i++) {
      const next = pts[(i + 1) % 6];
      c.arcTo(pts[i][0], pts[i][1], next[0], next[1], 8);
    }
  } else {
    const pts = [[0, -34], [28, 0], [0, 34], [-28, 0]];
    c.moveTo((pts[0][0] + pts[3][0]) / 2, (pts[0][1] + pts[3][1]) / 2);
    for (let i = 0; i < 4; i++) {
      const next = pts[(i + 1) % 4];
      c.arcTo(pts[i][0], pts[i][1], next[0], next[1], 10);
    }
  }
  c.closePath();
  c.fill();
  c.stroke();

  // 외곽 돌출 분화구: 절반인 3개로 축소 & +-30% 랜덤 크기
  for (let i = 0; i < 3; i++) {
    const ang = i * ((Math.PI * 2) / 3);
    const crX = Math.cos(ang) * 31;
    const crY = Math.sin(ang) * 34;
    const crR = 6.0 * (0.7 + ((rockId * 3 + i) % 7) * 0.1);
    c.fillStyle = theme.stroke;
    c.beginPath(); c.arc(crX, crY, crR, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#121318";
    c.beginPath(); c.arc(crX, crY, crR * 0.55, 0, Math.PI * 2); c.fill();
  }

  // 내부 분화구 4개
  const centerCraters = [
    { x: -7, y: -8, r: 3.5 },
    { x: 8, y: -5, r: 4.0 },
    { x: -6, y: 8, r: 3.2 },
    { x: 7, y: 9, r: 3.8 }
  ];
  centerCraters.forEach(cr => {
    c.fillStyle = "#121318";
    c.beginPath(); c.arc(cr.x, cr.y, cr.r, 0, Math.PI * 2); c.fill();
    c.strokeStyle = theme.stroke; c.lineWidth = 1.2; c.stroke();
  });

  c.restore();
}

function drawVectorEnemy(c, designId, isHeavy, rotDir, colorIdx, curTime) {
  if (isHeavy) drawVectorEliteAsteroid(c, designId, rotDir, colorIdx, curTime);
  else drawVectorRegularEnemy(c, (designId || 0) % 4);
}

    c.moveTo(-flashR * 1.5, -15); c.lineTo(flashR * 1.5, -15);
    c.stroke();
  }
  c.restore();
}

// =================================================================
// 5. 엔티티 정의
// =================================================================
class Player {
  constructor(pType, name, missileStat, powerStat, fireRateStat) {
    this.pType = pType; this.name = name;
    this.missileStat = Number(missileStat) || 1;
    this.powerStat = Number(powerStat) || 1;
    this.fireRateStat = Number(fireRateStat) || 1;
    this.clonePlaneTimer = 0.0; this.laserWeaponTimer = 0.0;
    this.lastLaserTime = 0.0;
    this.laserMuzzleFlashTime = 0.0;
    this.shotCount = 0;
    this.x = LOGICAL_WIDTH / 2; this.y = LOGICAL_HEIGHT * 0.8;
    this.targetX = this.x; this.targetY = this.y;
    this.radius = 22; this.shieldRemain = 0.0; this.lastShot = 0.0;
    this.isAlive = true;
    this.frontShieldRemain = 0.0;
    this.speedFanBurstTimer = 0.0;
    this.lightningTimer = 0.0;
    this.missileTimer = 0.0;
    this.missileFlashTime = 0.0;
    this.missileLaserTimer = 0.0;
  }
  getDominantTrait() {
    if (this.pType === 0) return "MISSILE";
    if (this.pType === 1) return "POWER";
    if (this.pType === 2) return "RATE";
    const maxVal = Math.max(this.powerStat, this.missileStat, this.fireRateStat);
    if (this.powerStat === maxVal) return "POWER";
    if (this.missileStat === maxVal) return "MISSILE";
    return "RATE";
  }
  getFireInterval() {
    let reductionFactor = CONFIG.FIRE_RATE_REDUCTION;
    if (this.pType === 2 || (this.pType === 3 && this.getDominantTrait() === "RATE")) reductionFactor = 0.08;
    const reduction = 1.0 / (1.0 + (Math.max(1, this.fireRateStat) - 1) * reductionFactor);
    let base = CONFIG.BASE_FIRE_INTERVAL;
    if (this.pType === 2) base *= 0.75;
    if (this.name === "Missile" || this.name === "Power") base *= 1.30;
    if (this.name === "Legend") base *= 0.70;
    return Math.max(0.08, (base * reduction) || 0.1);
  }
  getMissileDamage() {
    return 1.5 + (Math.max(1, this.missileStat) - 1) * 0.375;
  }
  update(dt, enemiesList, lightningList, bulletsList) {
    if (!this.isAlive) return;
    if (this.clonePlaneTimer > 0) this.clonePlaneTimer = Math.max(0, this.clonePlaneTimer - dt);
    if (this.laserWeaponTimer > 0) {
      this.laserWeaponTimer = Math.max(0, this.laserWeaponTimer - dt);
      const curT = performance.now() / 1000;
      if (curT - this.lastLaserTime >= 0.8) {
        this.lastLaserTime = curT;
        this.laserMuzzleFlashTime = curT;
       // 내 비행기보다 앞에 있고(y < this.y), 보스/돌맹이가 아닌 일반 적만 타겟
        const validEnemies = enemiesList.filter(e => !e.isDead && e.hp > 0 && !e.isHeavy && e.y >= 20 && e.y < this.y);
        if (validEnemies.length > 0) {
          validEnemies.sort((a, b) => b.y - a.y);
          const tgt = validEnemies[0];
          // 왼쪽 날개 포드(-32)에서 단일 빔 발사
          activeLasers.push({
            sx: this.x - 32, sy: this.y + 8,
            tx: tgt.x, ty: tgt.y,
            life: 0.20, totalLife: 0.20
          });
          // 체력 무시하고 즉사 처리
          safeKillEnemy(tgt, "#00f5ff");
          playTone(880, 0.20, "sine", -200, 0.12);
        }      }
    }
    if (this.shieldRemain > 0) this.shieldRemain = Math.max(0, this.shieldRemain - dt);
    if (this.frontShieldRemain > 0) this.frontShieldRemain = Math.max(0, this.frontShieldRemain - dt);

    this.missileTimer += dt;
    let baseInterval = (this.missileStat >= 8) ? 6.0 : 5.0;
    if (this.pType === 0) baseInterval *= 0.70;

    if (this.missileTimer >= baseInterval) {
      this.missileTimer = 0;
      this.missileFlashTime = performance.now() / 1000;
      const dmg = this.getMissileDamage();
      let burstCount = (this.missileStat >= 16) ? 4 : (this.missileStat >= 8 ? 2 : 1);
      if (this.pType === 0) burstCount *= 2;

      for (let b = 0; b < burstCount; b++) {
        setTimeout(() => {
          if (!this.isAlive) return;
          homingMissiles.push(new HomingMissile(this.x - 24, this.y - 6, -1.8, -7, dmg, "LEFT"));
          homingMissiles.push(new HomingMissile(this.x + 24, this.y - 6, 1.8, -7, dmg, "RIGHT"));
          playTone(550, 0.12, "sine", 200, 0.11);
        }, b * 150);
      }
    }

    if (this.pType === 0) {
      this.missileLaserTimer += dt;
      if (this.missileLaserTimer >= 0.5) {
        this.missileLaserTimer = 0;
        stationaryLasers.push(new StationaryMissileLaser(this.x, this.y - 20, 1.2, this.missileStat));
        playTone(740, 0.15, "triangle", -200, 0.1);
      }
    }

    if (!Number.isFinite(this.targetX)) this.targetX = this.x;
    if (!Number.isFinite(this.targetY)) this.targetY = this.y;

    const dx = this.targetX - this.x;
    const dy = this.targetY - this.y;
    const dist = Math.hypot(dx, dy);

    if (dist > 0.5) {
      // 순간이동 방지: 최대 이동 속도를 부드러운 스피드로 제한 (초당 최고속도 스케일)
      const maxSpd = CONFIG.BASE_PLAYER_SPEED * 75 * dt;
      const step = Math.min(dist * 0.25, maxSpd);
      this.x += (dx / dist) * step;
      this.y += (dy / dist) * step;
    }    const maxLimitX = LOGICAL_WIDTH - this.radius - (this.clonePlaneTimer > 0 ? 46 : 10);
    this.x = Math.max(this.radius + 10, Math.min(maxLimitX, this.x));
    this.y = Math.max(this.radius + 10, Math.min(LOGICAL_HEIGHT - this.radius - 10, this.y));
  }
  _fire(px, py, dmg, bullets) {
    if (this.pType === 0) return;

    const trait = this.getDominantTrait();
    let isBlackHoleShot = (trait === "POWER" && this.shotCount % 5 === 0);

    if (this.name === "Legend" || this.pType === 4) {
      bullets.push(new Bullet(px, py - 22, 0, -17, dmg, 4.5, "LEGEND"));
      bullets.push(new Bullet(px, py - 22, -1.0, -17, dmg, 4.5, "LEGEND"));
      bullets.push(new Bullet(px, py - 22, 1.0, -17, dmg, 4.5, "LEGEND"));
      playTone(900, 0.08, "triangle", -400, 0.1);
    } else if (this.pType === 2 || trait === "RATE") {
      if (bullets.length < 150) {
        bullets.push(new Bullet(px - 14, py - 20, 0, -15, dmg, 4.0, "TWIN"));
        bullets.push(new Bullet(px + 14, py - 20, 0, -15, dmg, 4.0, "TWIN"));
      }
      playTone(600, 0.04, "sine", -250, 0.06);
    } else if (this.pType === 1 || trait === "POWER") {
      bullets.push(new Bullet(px, py - 24, 0, -14, dmg * 1.5, isBlackHoleShot ? 8 : 6, isBlackHoleShot ? "BLACK_HOLE" : "POWER", isBlackHoleShot));
      if (this.powerStat >= 8) {
        const subDmg = (this.powerStat >= 16) ? dmg : (dmg * 0.5);
        bullets.push(new Bullet(px - 22, py - 14, -1.0, -13, subDmg, 4, "POWER"));
        bullets.push(new Bullet(px + 22, py - 14, 1.0, -13, subDmg, 4, "POWER"));
      }
      playTone(380, 0.12, "sawtooth", -150, 0.08);
    } else {
      bullets.push(new Bullet(px, py - 22, 0, -17, dmg, 4.0, "DEFAULT"));
      playTone(700, 0.07, "square", -300, 0.08);
    }
  }
  shoot(curTime, bullets) {
    if (!this.isAlive) return;
    if (curTime - this.lastShot >= this.getFireInterval()) {
      this.lastShot = curTime;
      this.shotCount++;
      let baseDmg = Math.max(1, this.powerStat || 1);
      if (this.pType === 1 || (this.pType === 3 && this.getDominantTrait() === "POWER")) {
        baseDmg = 1 + (this.powerStat - 1) * 2.2;
      }
      const dmg = baseDmg * 1.2;
      this._fire(this.x, this.y, dmg, bullets);
      if (this.clonePlaneTimer > 0) this._fire(this.x + 42, this.y, dmg, bullets);
    }
  }
  draw(curTime) {
    if (!this.isAlive) return;
    const isDoubleDim = (this.clonePlaneTimer > 0 && this.clonePlaneTimer <= 5.0) && (Math.floor(curTime / 0.3) % 2 === 0);
    const isShieldDim = (this.shieldRemain > 0 && this.shieldRemain <= 5.0) && (Math.floor(curTime / 0.3) % 2 === 0);
    const isMissileFlash = (curTime - this.missileFlashTime < 0.15);

    const drawShipAt = (cx, cy, isClone=false) => {
      ctx.save();
      if (isClone && isDoubleDim) ctx.globalAlpha = 0.35;
      ctx.translate(cx, cy);

      let themeColor = "#00f5ff";
      if (this.name === "Legend" || this.pType === 4) themeColor = "#ffd700";
      else if (this.pType === 1) themeColor = "#ff2244";
      else if (this.pType === 2) themeColor = "#00ff66";

      drawVectorPlayer(ctx, this.pType, themeColor, 1.2, 0, isMissileFlash);

      if (this.laserWeaponTimer > 0) {
        const isFlashing = (curTime - this.laserMuzzleFlashTime) < 0.20;
        drawVectorLaserPod(ctx, -32, 8, isFlashing, curTime); // 왼쪽 날개만 단독 설치
      }      ctx.restore();
    };

    drawShipAt(this.x, this.y, false);
    if (this.clonePlaneTimer > 0) drawShipAt(this.x + 42, this.y, true);

    if (this.shieldRemain > 0) {
      ctx.save();
      if (isShieldDim) ctx.globalAlpha = 0.3;
      ctx.strokeStyle = "rgba(50, 255, 120, 0.9)";
      ctx.lineWidth = 2.0;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius + 32, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // 4. 버프 이름 노출 후 그 아래에 잔여시간 표시
    const timers = [];
    if (this.shieldRemain > 0) timers.push({ label: "SHIELD", val: this.shieldRemain.toFixed(1), col: "#32ff78" });
    if (this.laserWeaponTimer > 0) timers.push({ label: "LASER", val: this.laserWeaponTimer.toFixed(1), col: "#00f5ff" });
    if (this.clonePlaneTimer > 0) timers.push({ label: "TWIN", val: this.clonePlaneTimer.toFixed(1), col: "#78a0ff" });

    if (timers.length > 0) {
      ctx.save();
      ctx.textAlign = "center";
      let startOffset = this.y + this.radius + 16;
      timers.forEach((t) => {
        ctx.font = `bold 11px ${FONT_FAMILY}`;
        ctx.fillStyle = t.col;
        ctx.fillText(t.label, this.x, startOffset);
        ctx.font = `bold 10px ${FONT_FAMILY}`;
        ctx.fillText(`${t.val}s`, this.x, startOffset + 12);
        startOffset += 26;
      });
      ctx.restore();
    }
  }
}

class MissileShadow {
  constructor(x, y, radius) {
    this.x = x; this.y = y;
    this.radius = radius * 0.5;
    this.life = 0.3;
    this.totalLife = 0.3;
  }
  update(dt) { this.life -= dt; }
  draw() {
    if (this.life <= 0) return;
    ctx.save();
    ctx.globalAlpha = (this.life / this.totalLife) * 0.5;
    ctx.fillStyle = "#ff007f";
    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

class HomingMissile {
  constructor(x, y, vx, vy, dmg, side="LEFT") {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.dmg = dmg;
    this.side = side;
    this.radius = 4.0;
    this.life = 4.0;
    this.target = null;
    this.shadowTimer = 0;
  }
  update(dt, enemiesList) {
    this.life -= dt;
    this.shadowTimer += dt;
    if (this.shadowTimer >= 0.04) {
      this.shadowTimer = 0;
      missileShadows.push(new MissileShadow(this.x, this.y, this.radius));
    }

    const maxYBound = LOGICAL_HEIGHT * 0.90;

    if (!this.target || this.target.hp <= 0 || this.target.isDead || this.target.y > maxYBound) {
      const targetedSet = new Set(homingMissiles.filter(m => m !== this && m.target).map(m => m.target));

      let valids = enemiesList.filter(e => {
        if (e.hp <= 0 || e.isDead || e.isHeavy || e.hasShield) return false;
        if (e.y < 20 || e.y > maxYBound) return false;
        if (player) {
          if (this.side === "LEFT" && e.x > player.x) return false;
          if (this.side === "RIGHT" && e.x < player.x) return false;
        }
        return true;
      });

      let untargeted = valids.filter(e => !targetedSet.has(e));
      let pool = untargeted.length > 0 ? untargeted : valids;

      if (pool.length > 0) {
        pool.sort((a, b) => Math.hypot(a.x - this.x, a.y - this.y) - Math.hypot(b.x - this.x, b.y - this.y));
        this.target = pool[0];
      }
    }

    if (this.target) {
      const angleToTarget = Math.atan2(this.target.y - this.y, this.target.x - this.x);
      const curAngle = Math.atan2(this.vy, this.vx);
      let diff = angleToTarget - curAngle;
      while (diff < -Math.PI) diff += Math.PI * 2;
      while (diff > Math.PI) diff -= Math.PI * 2;
      const turnRate = 5.5 * dt;
      const newAngle = curAngle + Math.max(-turnRate, Math.min(turnRate, diff));
      const spd = 12.5;
      this.vx = Math.cos(newAngle) * spd;
      this.vy = Math.sin(newAngle) * spd;
    }

    this.x += this.vx * (dt * 60);
    this.y += this.vy * (dt * 60);
  }
  draw() {
    ctx.save();
    ctx.fillStyle = "#ff007f";
    ctx.shadowColor = "#ff007f";
    ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(this.x, this.y, 2.0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

// 1. 미사일형 레이저: 1차 수직 직진, 2차 최대 10도 절대 제한, 5갈래 반사 레이저 50% 축소 및 그라데이션
class StationaryMissileLaser {
  constructor(x, y, powerDmg, missileLv) {
    this.x = x;
    this.startY = y;
    this.powerDmg = powerDmg;
    this.missileLv = missileLv;
    this.life = 0.45;
    this.totalLife = 0.45;
    this.damageTickTimer = 0;
    this.path = [];
    this.hitEnemies = [];
    this.reflectedShards = [];
    this.calculateChainPath();
  }

  calculateChainPath() {
    this.path = [{ x: this.x, y: this.startY }];
    this.hitEnemies = [];
    this.reflectedShards = [];
    const maxBendRad = (10 * Math.PI) / 180;
    const maxSearchWidth = 10 * 5;

    let blockedObj = null;
    let blockY = 0;

    enemies.filter(e => e.isHeavy && !e.isDead && e.hp > 0 && e.y < this.startY && e.y >= 20).forEach(e => {
      if (Math.abs(e.x - this.x) <= e.radius + 6) {
        if (!blockedObj || e.y > blockY) { blockedObj = e; blockY = e.y + e.radius; }
      }
    });

    meteorManager.meteors.filter(m => m.active && m.y < this.startY && m.y >= 20).forEach(m => {
      if (Math.abs(m.x - this.x) <= m.radius + 6) {
        if (!blockedObj || m.y > blockY) { blockedObj = m; blockY = m.y + m.radius; }
      }
    });

    if (blockedObj) {
      this.path.push({ x: this.x, y: blockY });
      const shardLen = 88;
      for (let s = 0; s < 5; s++) {
        const ang = Math.PI / 2 + (Math.random() - 0.5) * (Math.PI / 2);
        this.reflectedShards.push({
          sx: this.x, sy: blockY,
          ex: this.x + Math.cos(ang) * shardLen,
          ey: blockY + Math.sin(ang) * shardLen
        });
      }
      return;
    }

    const valids1 = enemies.filter(e => {
      if (e.hp <= 0 || e.isDead || e.isHeavy) return false;
      if (e.y >= this.startY || e.y < 20) return false;
      return Math.abs(e.x - this.x) <= maxSearchWidth + e.radius;
    });

    if (valids1.length === 0) {
      this.path.push({ x: this.x, y: 0 });
      return;
    }

    valids1.sort((a, b) => Math.hypot(a.x - this.x, a.y - this.startY) - Math.hypot(b.x - this.x, b.y - this.startY));
    let t1 = valids1[0];

    // 내 비행기에서는 무조건 수직 직진으로 발사
    this.path.push({ x: this.x, y: t1.y });
    if (Math.abs(this.x - t1.x) <= t1.radius + 12) {
      this.hitEnemies.push(t1);
    }

    const valids2 = enemies.filter(e => e !== t1 && e.hp > 0 && !e.isDead && !e.isHeavy && e.y < t1.y && e.y >= 20);
    if (valids2.length === 0) {
      this.path.push({ x: this.x, y: 0 });
      return;
    }

    valids2.sort((a, b) => Math.hypot(a.x - this.x, a.y - t1.y) - Math.hypot(b.x - this.x, b.y - t1.y));
    let t2 = valids2[0];

    // 적을 만났을 때만 다음 적 방향으로 최대 10도 굴절 제한
    let dx2 = t2.x - this.x;
    let dy2 = t2.y - t1.y;
    let angle2 = Math.atan2(dx2, -dy2);
    let clampedAngle2 = Math.max(-maxBendRad, Math.min(maxBendRad, angle2));
    let finalX2 = this.x + Math.sin(clampedAngle2) * Math.abs(dy2);

    this.path.push({ x: finalX2, y: t2.y });
    if (Math.abs(finalX2 - t2.x) <= t2.radius + 12) {
      this.hitEnemies.push(t2);
    }

    let remainDist2 = t2.y;
    this.path.push({ x: finalX2 + Math.sin(clampedAngle2) * remainDist2, y: 0 });
  }

  update(dt, enemiesList) {
    this.life -= dt;
    this.damageTickTimer += dt;
    if (this.damageTickTimer >= 0.15) {
      this.damageTickTimer = 0;
      this.hitEnemies.forEach(e => {
        if (e && !e.isDead && e.hp > 0) {
          const hitCount = e.hasShield ? 2 : 1;
          for (let h = 0; h < hitCount; h++) {
            applyDamageToEnemy(e, this.powerDmg, "MISSILE_NEEDLE");
          }
        }
      });

      if (this.reflectedShards.length > 0) {
        this.reflectedShards.forEach(sh => {
          enemiesList.forEach(e => {
            if (!e.isDead && e.hp > 0 && !e.isHeavy) {
              if (Math.hypot(e.x - sh.ex, e.y - sh.ey) <= e.radius + 15) {
                applyDamageToEnemy(e, this.powerDmg, "MISSILE_NEEDLE");
              }
            }
          });
        });
      }

      if (currentBoss && currentBoss.hp > 0) {
        for (let i = 0; i < this.path.length - 1; i++) {
          const segX = this.path[i].x;
          if (Math.abs(segX - currentBoss.x) <= currentBoss.radius + 8) {
            currentBoss.hp -= 2;
            hitImpacts.push(new BulletHitImpactFX(currentBoss.x, currentBoss.y, "MISSILE_NEEDLE"));
            playTone(450, 0.08, "triangle", 0, 0.08);
            if (currentBoss.hp <= 0) {
              score += 100;
              bossDropItems.push(new BossDropItem(currentBoss.x, currentBoss.y));
              currentBoss = null;
              playExplosionSound();
            }
            break;
          }
        }
      }
    }
  }

  draw() {
    if (this.life <= 0 || this.path.length < 2) return;
    const progress = 1.0 - (this.life / this.totalLife);
    const alpha = Math.max(0, this.life / this.totalLife);

    const bottomCutLength = (this.startY - this.path[1].y) * 0.20 * Math.pow(progress, 0.6);
    const renderPath = JSON.parse(JSON.stringify(this.path));
    renderPath[0].y = this.startY - bottomCutLength;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";

    // 레이저 기본 두께 30% 축소 (6.86 / 1.96)
    ctx.strokeStyle = "rgba(0, 245, 255, 0.45)";
    ctx.lineWidth = 6.86;
    ctx.beginPath();
    ctx.moveTo(renderPath[0].x, renderPath[0].y);
    for (let i = 1; i < renderPath.length; i++) ctx.lineTo(renderPath[i].x, renderPath[i].y);
    ctx.stroke();

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.96;
    ctx.beginPath();
    ctx.moveTo(renderPath[0].x, renderPath[0].y);
    for (let i = 1; i < renderPath.length; i++) ctx.lineTo(renderPath[i].x, renderPath[i].y);
    ctx.stroke();

    // 반사 레이저: 두께 50% 축소 + 종료 지점 투명도 0% 그라데이션
    if (this.reflectedShards.length > 0) {
      this.reflectedShards.forEach(sh => {
        const gradOuter = ctx.createLinearGradient(sh.sx, sh.sy, sh.ex, sh.ey);
        gradOuter.addColorStop(0, "rgba(0, 245, 255, 0.9)");
        gradOuter.addColorStop(1, "rgba(0, 245, 255, 0.0)");
        ctx.strokeStyle = gradOuter;
        ctx.lineWidth = 2.45;
        ctx.beginPath();
        ctx.moveTo(sh.sx, sh.sy); ctx.lineTo(sh.ex, sh.ey);
        ctx.stroke();

        const gradInner = ctx.createLinearGradient(sh.sx, sh.sy, sh.ex, sh.ey);
        gradInner.addColorStop(0, "rgba(255, 255, 255, 1.0)");
        gradInner.addColorStop(1, "rgba(255, 255, 255, 0.0)");
        ctx.strokeStyle = gradInner;
        ctx.lineWidth = 0.7;
        ctx.beginPath();
        ctx.moveTo(sh.sx, sh.sy); ctx.lineTo(sh.ex, sh.ey);
        ctx.stroke();
      });
    }

    for (let i = 1; i < renderPath.length - 1; i++) {
      ctx.fillStyle = "#ffe600";
      ctx.beginPath(); ctx.arc(renderPath[i].x, renderPath[i].y, 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

class BulletHitImpactFX {
  constructor(x, y, bulletType) {
    this.x = x; this.y = y;
    this.bulletType = bulletType;
    this.life = 0.2;
    this.totalLife = 0.2;
  }
  update(dt) { this.life -= dt; }
  draw() {
    if (this.life <= 0) return;
    const alpha = Math.max(0, this.life / this.totalLife);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(this.x, this.y);

    if (this.bulletType === "LEGEND") {
      ctx.strokeStyle = "#ffd700";
      ctx.lineWidth = 2.0;
      for (let i = 0; i < 8; i++) {
        const rad = (i * Math.PI) / 4;
        ctx.beginPath();
        ctx.moveTo(Math.cos(rad) * 4, Math.sin(rad) * 4);
        ctx.lineTo(Math.cos(rad) * 14, Math.sin(rad) * 14);
        ctx.stroke();
      }
    } else if (this.bulletType === "POWER" || this.bulletType === "BLACK_HOLE") {
      ctx.strokeStyle = "#ff0055";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(0, 0, (1.0 - alpha) * 18 + 4, 0, Math.PI * 2);
      ctx.stroke();
    } else if (this.bulletType === "TWIN") {
      ctx.strokeStyle = "#00ff66";
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(-10, -6); ctx.lineTo(0, 0); ctx.lineTo(10, -8);
      ctx.moveTo(-6, 8); ctx.lineTo(0, 0); ctx.lineTo(8, 6);
      ctx.stroke();
    } else {
      ctx.strokeStyle = "#00f5ff";
      ctx.lineWidth = 2.0;
      ctx.beginPath();
      ctx.moveTo(-8, 0); ctx.lineTo(8, 0);
      ctx.moveTo(0, -8); ctx.lineTo(0, 8);
      ctx.stroke();
    }
    ctx.restore();
  }
}

class Meteor {
  constructor(themeIndex, side, spawnY) {
    this.theme = METEOR_THEMES[themeIndex % METEOR_THEMES.length];
    this.side = side;
    this.radius = 24;
    this.tailLength = 225;
    this.tailWidth = this.radius * 0.95 * 0.70;
    this.headShapeType = Math.floor(Math.random() * 5);
    this.rotSpeed = 4.5 * 1.30;

    this.craters = Array.from({ length: 7 }, () => {
      const ang = Math.random() * Math.PI * 2;
      const dist = Math.random() * (this.radius * 0.65);
      return { x: Math.cos(ang) * dist, y: Math.sin(ang) * dist, r: 1.8 + Math.random() * 2.8 };
    });

    const speed = 3.75;
    const targetX = LOGICAL_WIDTH * 0.5;
    const targetY = LOGICAL_HEIGHT;

    const isTopSpawn = Math.random() < 0.5;
    if (isTopSpawn) {
      this.y = -60;
      this.x = this.side === "left" ? Math.random() * (LOGICAL_WIDTH * 0.35) : LOGICAL_WIDTH * 0.65 + Math.random() * (LOGICAL_WIDTH * 0.35);
    } else {
      this.y = spawnY;
      this.x = this.side === "left" ? -60 : LOGICAL_WIDTH + 60;
    }

    const angle = Math.atan2(targetY - this.y, targetX - this.x);
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.coreAngle = 0;
    this.active = true;
    this.isBeingSucked = false;
  }
  update(dt) {
    if (this.isBeingSucked) return;
    this.x += this.vx * (dt * 60);
    this.y += this.vy * (dt * 60);
    this.coreAngle += this.rotSpeed * dt;
    if (this.y > LOGICAL_HEIGHT + 240 || (this.side === "left" && this.x > LOGICAL_WIDTH + 240) || (this.side === "right" && this.x < -240)) {
      this.active = false;
    }
  }
  draw() {
    ctx.save();
    const moveAngle = Math.atan2(this.vy, this.vx);
    const tailAngle = moveAngle + Math.PI;
    const tailTipX = this.x + Math.cos(tailAngle) * this.tailLength;
    const tailTipY = this.y + Math.sin(tailAngle) * this.tailLength;

    ctx.globalAlpha = 0.75;
    const tailGrad = ctx.createLinearGradient(this.x, this.y, tailTipX, tailTipY);
    tailGrad.addColorStop(0, this.theme.mid);
    tailGrad.addColorStop(0.35, this.theme.outer);
    tailGrad.addColorStop(1, "rgba(0,0,0,0)");

    ctx.fillStyle = tailGrad;
    ctx.beginPath();
    const perpAngle = moveAngle + Math.PI / 2;
    ctx.moveTo(this.x + Math.cos(perpAngle) * this.tailWidth, this.y + Math.sin(perpAngle) * this.tailWidth);
    ctx.lineTo(tailTipX, tailTipY);
    ctx.lineTo(this.x - Math.cos(perpAngle) * this.tailWidth, this.y - Math.sin(perpAngle) * this.tailWidth);
    ctx.closePath();
    ctx.fill();

    ctx.translate(this.x, this.y);
    ctx.rotate(this.coreAngle);

    const r = this.radius;
    ctx.fillStyle = this.theme.core;
    ctx.strokeStyle = this.theme.outer;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    if (this.headShapeType === 0) {
      ctx.moveTo(0, -r); ctx.lineTo(r * 0.9, -r * 0.6); ctx.lineTo(r * 0.7, r * 0.7); ctx.lineTo(-r * 0.4, r * 1.1); ctx.lineTo(-r * 1.0, -r * 0.2);
    } else if (this.headShapeType === 1) {
      ctx.moveTo(-r * 0.5, -r * 0.9); ctx.lineTo(r * 0.8, -r * 0.8); ctx.lineTo(r * 1.1, r * 0.3); ctx.lineTo(r * 0.2, r * 1.0); ctx.lineTo(-r * 0.9, r * 0.6);
    } else if (this.headShapeType === 2) {
      ctx.moveTo(0, -r * 1.1); ctx.lineTo(r * 1.0, -r * 0.2); ctx.lineTo(r * 0.8, r * 0.9); ctx.lineTo(-r * 0.8, r * 0.8); ctx.lineTo(-r * 1.1, -r * 0.4);
    } else if (this.headShapeType === 3) {
      ctx.moveTo(-r * 0.2, -r * 1.0); ctx.lineTo(r * 1.1, -r * 0.3); ctx.lineTo(r * 0.6, r * 1.0); ctx.lineTo(-r * 0.6, r * 0.9); ctx.lineTo(-r * 1.0, -r * 0.1);
    } else {
      ctx.moveTo(0, -r * 0.9); ctx.lineTo(r * 0.9, -r * 0.5); ctx.lineTo(r * 1.1, r * 0.6); ctx.lineTo(-r * 0.3, r * 1.0); ctx.lineTo(-r * 1.1, 0);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    this.craters.forEach(cr => {
      ctx.fillStyle = "#110408";
      ctx.beginPath(); ctx.arc(cr.x, cr.y, cr.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = this.theme.outer; ctx.lineWidth = 1.0; ctx.stroke();
    });

    ctx.restore();
  }
}

class MeteorManager {
  constructor() { this.reset(); }
  reset() {
    this.meteors = [];
    this.pendingQueue = [];
    this.warningActive = false;
    this.warningStartTime = 0;
    this.nextSpawnTime = 40.0;
  }
  scheduleMeteor(spawnTime) {
    const side = Math.random() < 0.5 ? "left" : "right";
    const spawnY = Math.random() * (LOGICAL_HEIGHT * 0.25);
    const themeIdx = Math.floor(Math.random() * METEOR_THEMES.length);
    this.pendingQueue.push({ triggerAt: spawnTime, side, spawnY, themeIdx, warned: false });
  }
  update(dt, elapsed, player, bulletsList, enemiesList) {
    if (elapsed < 40.0) {
      this.meteors = [];
      this.pendingQueue = [];
      this.warningActive = false;
      return;
    }

    if (elapsed >= this.nextSpawnTime) {
      this.scheduleMeteor(elapsed + 3.0);
      this.nextSpawnTime = elapsed + 25.0 + Math.random() * 15.0;
    }

    for (let i = this.pendingQueue.length - 1; i >= 0; i--) {
      const p = this.pendingQueue[i];
      if (!p.warned && elapsed >= p.triggerAt - 3.0) {
        p.warned = true;
        this.warningActive = true;
        this.warningStartTime = elapsed;
        playMeteorWarningSound();
      }
      if (elapsed >= p.triggerAt) {
        this.meteors.push(new Meteor(p.themeIdx, p.side, p.spawnY));
        this.pendingQueue.splice(i, 1);
      }
    }

    if (this.warningActive && elapsed - this.warningStartTime >= 3.0) this.warningActive = false;

    this.meteors.forEach(m => m.update(dt));
    this.meteors = this.meteors.filter(m => m.active);

    this.meteors.forEach(m => {
      if (m.y < 20 || m.isBeingSucked) return;

      enemiesList.forEach(e => {
        if (e.isHeavy && !e.isDead && Math.hypot(e.x - m.x, e.y - m.y) < e.radius + m.radius) {
          safeKillEnemy(e, "#ff4466");
          playExplosionSound();
        }
      });

      for (let bi = bulletsList.length - 1; bi >= 0; bi--) {
        const b = bulletsList[bi];
        if (Math.hypot(b.x - m.x, b.y - m.y) < b.radius + m.radius) {
          hitImpacts.push(new BulletHitImpactFX(b.x, b.y, b.bulletType));
          if (b.isBlackHoleTrigger) {
            blackHoles.push(new BlackHole(b.x, b.y, 25));
          }
          bulletsList.splice(bi, 1);
          explosions.push(new ExplosionFX(b.x, b.y, "#ff7700"));
          playTone(400, 0.05, "sawtooth", 0, 0.08);
        }
      }
      if (player && player.isAlive && !m.isBeingSucked) {
        const shieldDist = player.radius + 32;
        const mdx = m.x - player.x;
        const mdy = m.y - player.y;
        const mDist = Math.hypot(mdx, mdy);
        const minDist = shieldDist + m.radius;
        if (player.shieldRemain > 0 && mDist < minDist) {
          const pushAng = Math.atan2(mdy, mdx);
          m.x = player.x + Math.cos(pushAng) * minDist;
          m.y = player.y + Math.sin(pushAng) * minDist;
          m.vx = Math.cos(pushAng) * 4.0;
        } else if (player.shieldRemain <= 0 && mDist < player.radius + m.radius) {
          triggerPlayerCinematicDeath(m.x, m.y);
        }
      }    });
  }
  drawWarning() {
    if (!this.warningActive) return;
    const curTime = performance.now() / 1000;
    if (Math.floor(curTime / 0.15) % 2 === 0) {
      ctx.save();
      ctx.textAlign = "center";
      ctx.fillStyle = "#ff2200";
      ctx.font = `bold 16px ${FONT_FAMILY}`;
      ctx.fillText("⚠ WARNING: GIANT METEOR INCOMING! ⚠", LOGICAL_WIDTH / 2, 198);
      ctx.restore();
    }
  }
  drawMeteors() { this.meteors.forEach(m => m.draw()); }
}

class Star {
  constructor() {
    this.x = Math.random() * LOGICAL_WIDTH;
    this.y = Math.random() * LOGICAL_HEIGHT;
    this.speed = 0.8 + Math.random() * 2.8;
    this.size = this.speed > 2.5 ? 2.0 : (this.speed > 1.6 ? 1.5 : 1.0);
    const alpha = Math.min(0.8, (0.3 + this.speed * 0.25) * 0.8);
    this.color = `rgba(${145 + Math.floor(Math.random() * 60)}, ${160 + Math.floor(Math.random() * 45)}, 205, ${alpha})`;
  }
  update() {
    this.y += this.speed;
    if (this.y > LOGICAL_HEIGHT) { this.y = 0; this.x = Math.random() * LOGICAL_WIDTH; }
  }
  draw() {
    ctx.fillStyle = this.color;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
  }
}

class Comet {
  constructor() { this.reset(); }
  reset() {
    this.active = false;
    this.x = 0; this.y = 0; this.vx = 0; this.vy = 0; this.length = 0; this.alpha = 0;
  }
  spawn() {
    this.active = true;
    this.x = Math.random() * (LOGICAL_WIDTH * 0.8);
    this.y = -20;
    const speed = 4.0 + Math.random() * 3.5;
    const angle = (55 + Math.random() * 20) * (Math.PI / 180);
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.length = 45 + Math.random() * 45;
    this.alpha = 0.15 + Math.random() * 0.2;
  }
  update(dt) {
    if (!this.active) return;
    this.x += this.vx * (dt * 60);
    this.y += this.vy * (dt * 60);
    if (this.x > LOGICAL_WIDTH + 60 || this.y > LOGICAL_HEIGHT + 60) this.active = false;
  }
  draw() {
    if (!this.active) return;
    ctx.save();
    ctx.globalAlpha = this.alpha;
    const tailX = this.x - (this.vx * (this.length / 8));
    const tailY = this.y - (this.vy * (this.length / 8));
    const grad = ctx.createLinearGradient(tailX, tailY, this.x, this.y);
    grad.addColorStop(0, "rgba(0, 245, 255, 0)");
    grad.addColorStop(1, "rgba(255, 255, 255, 0.95)");
    ctx.strokeStyle = grad; ctx.lineWidth = 2.0;
    ctx.beginPath(); ctx.moveTo(tailX, tailY); ctx.lineTo(this.x, this.y); ctx.stroke();
    ctx.restore();
  }
}

class SuckingEntityFX {
  constructor(obj, bhX, bhY, type) {
    this.bhX = bhX;
    this.bhY = bhY;
    this.life = 0.45;
    this.totalLife = 0.45;
    this.dustParticles = Array.from({ length: 12 }, () => {
      const offsetDist = Math.random() * (obj.radius || 15);
      const offsetAng = Math.random() * Math.PI * 2;
      const px = obj.x + Math.cos(offsetAng) * offsetDist;
      const py = obj.y + Math.sin(offsetAng) * offsetDist;
      return {
        dist: Math.hypot(px - bhX, py - bhY),
        angle: Math.atan2(py - bhY, px - bhX),
        size: 1.5 + Math.random() * 2.0,
        speedFactor: 12.0 + Math.random() * 6.0
      };
    });
  }
  update(dt) {
    this.life -= dt;
    this.dustParticles.forEach(p => {
      p.angle -= dt * p.speedFactor; // 반대 방향(반시계) 회전 흡수
      p.dist *= Math.pow(0.04, dt);
    });
  }
  draw() {
    if (this.life <= 0) return;
    const progress = Math.max(0, this.life / this.totalLife);
    ctx.save();
    ctx.globalAlpha = progress;
    ctx.fillStyle = "#d044ff";
    this.dustParticles.forEach(p => {
      const dx = this.bhX + Math.cos(p.angle) * p.dist;
      const dy = this.bhY + Math.sin(p.angle) * p.dist;
      ctx.beginPath();
      ctx.arc(dx, dy, p.size * progress, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }
}

// 3. 블랙홀: 반대 방향 회전, 크기 50% 증가, 유지 시간 30% 증가
class BlackHole {
  constructor(x, y, baseRadius) {
    this.x = x; this.y = y;
    this.baseRadius = (baseRadius * 1.5) * 1.5; // 크기 50% 증가
    this.life = 2.0 * 1.3; // 유지 시간 30% 증가 (2.6초)
    this.totalLife = this.life;
    this.rotAngle = 0;
  }
  update(dt, enemiesList) {
    this.life -= dt;
    this.rotAngle -= dt * ((Math.PI * 2) / 2.0); // 반대 방향(반시계) 회전

    const curR = this.baseRadius * (1.0 + Math.sin(this.life * 8) * 0.08);

    for (let ei = enemiesList.length - 1; ei >= 0; ei--) {
      const e = enemiesList[ei];
      if (e.y < 20 || e.isDead || e.hp <= 0 || e.isBeingSucked) continue;
      if (Math.hypot(e.x - this.x, e.y - this.y) <= curR + e.radius) {
        e.isBeingSucked = true;
        suckingEntities.push(new SuckingEntityFX(e, this.x, this.y, "ENEMY"));
        score += 1;
        safeKillEnemy(e, "#bf00ff");
      }
    }

    meteorManager.meteors.forEach(m => {
      if (m.active && m.y >= 20 && !m.isBeingSucked) {
        if (Math.hypot(m.x - this.x, m.y - this.y) <= curR + m.radius) {
          m.isBeingSucked = true;
          m.active = false;
          suckingEntities.push(new SuckingEntityFX(m, this.x, this.y, "METEOR"));
          score += 1;
        }
      }
    });
  }
  draw() {
    if (this.life <= 0) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotAngle);

    const r = this.baseRadius;

    ctx.strokeStyle = "rgba(191, 0, 255, 0.75)";
    ctx.lineWidth = 2.2;
    for (let i = 0; i < 4; i++) {
      ctx.save();
      ctx.rotate((i * Math.PI) / 2);
      ctx.beginPath();
      for (let theta = 0; theta < Math.PI * 1.5; theta += 0.1) {
        const spiralR = (r * 0.75) * (theta / (Math.PI * 1.5));
        const sx = Math.cos(theta) * spiralR;
        const sy = Math.sin(theta) * spiralR;
        if (theta === 0) ctx.moveTo(sx, sy);
        else ctx.lineTo(sx, sy);
      }
      ctx.stroke();
      ctx.restore();
    }

    const coreGrad = ctx.createRadialGradient(0, 0, 1, 0, 0, r * 0.65);
    coreGrad.addColorStop(0, "#000000");
    coreGrad.addColorStop(0.5, "rgba(35, 0, 60, 0.9)");
    coreGrad.addColorStop(1, "rgba(191, 0, 255, 0)");
    ctx.fillStyle = coreGrad;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.65, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
  }
}

// 2. 돌맹이 파편: 퍼지는 범위 50% 축소 & 점진적 투명 페이드
class RockDebrisFX {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.life = 2.0;
    this.totalLife = 2.0;
    this.shards = Array.from({ length: 6 }, (_, idx) => {
      const ang = (idx * Math.PI / 3) + (Math.random() - 0.5) * 0.4;
      const spd = (1.5 + Math.random() * 2.5) * 0.5; // 퍼지는 범위 50% 축소
      return { x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, size: 7 + Math.random() * 4, rot: Math.random() * Math.PI, rotSpd: (Math.random() - 0.5) * 4 };
    });
  }
  update(dt) {
    this.life -= dt;
    this.shards.forEach(s => {
      s.x += s.vx * (dt * 60);
      s.y += s.vy * (dt * 60);
      s.rot += s.rotSpd * dt;
    });
  }
  draw() {
    if (this.life <= 0) return;
    ctx.save();

      ctx.fillStyle = "#27272a";

      ctx.strokeRect(-s.size / 2, -s.size / 2, s.size, s.size);

    });

}

class ExplosionFX {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.color = color || "#ffe600";
    this.fxType = Math.floor(Math.random() * 6);
    this.life = 1.0;
    this.decay = 2.4 + Math.random() * 1.2;
    this.particles = [];
    for (let i = 0; i < 12; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = 2 + Math.random() * 5.5;
      this.particles.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: 2 + Math.random() * 3 });
    }
  }
  update(dt) {
    this.life -= this.decay * dt;
    this.particles.forEach(p => { p.x += p.vx; p.y += p.vy; });
  }
  draw() {
    if (this.life <= 0) return;
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.strokeStyle = this.color;
    ctx.fillStyle = this.color;

    if (this.fxType === 0) {
      this.particles.forEach(p => ctx.fillRect(p.x - 2, p.y - 2, 4, 4));
    } else if (this.fxType === 1) {
      const ringR = (1.0 - this.life) * 48;
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(this.x, this.y, ringR, 0, Math.PI * 2); ctx.stroke();
    } else if (this.fxType === 2) {
      const len = (1.0 - this.life) * 35 + 10;
      ctx.lineWidth = 2.0;
      ctx.beginPath();
      ctx.moveTo(this.x - len, this.y); ctx.lineTo(this.x + len, this.y);
      ctx.moveTo(this.x, this.y - len); ctx.lineTo(this.x + len, this.y);
      ctx.stroke();
    } else if (this.fxType === 3) {
      this.particles.forEach(p => {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      });
    } else if (this.fxType === 4) {
      const size = (1.0 - this.life) * 26;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.life * 5);
      ctx.strokeRect(-size / 2, -size / 2, size, size);
      ctx.restore();
    } else {
      const r1 = (1.0 - this.life) * 32;
      const r2 = (1.0 - this.life) * 54;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(this.x, this.y, r1, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(this.x, this.y, r2, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }
}

let playerDeathCinematic = {
  active: false,
  timer: 0.0,
  shards: []
};

function triggerPlayerCinematicDeath(hitSourceX, hitSourceY) {
  if (playerDeathCinematic.active || !player) return;
  player.isAlive = false;
  playerDeathCinematic.active = true;
  playerDeathCinematic.timer = 0.0;

  const pCol = player.pType === 4 ? "#ffd700" : (player.pType === 1 ? "#ff2244" : (player.pType === 2 ? "#00ff66" : "#00f5ff"));
  playerDeathCinematic.shards = Array.from({ length: 24 }, (_, idx) => {
    const ang = Math.random() * Math.PI * 2;
    const spd = 4.0 + Math.random() * 6.0;
    return {
      x: player.x, y: player.y,
      vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      w: 4 + Math.random() * 8,
      h: 2 + Math.random() * 6,
      rot: Math.random() * Math.PI,
      rotSpd: (Math.random() - 0.5) * 12,
      color: idx % 3 === 0 ? "#ffffff" : pCol
    };
  });

  explosions.push(new ExplosionFX(player.x, player.y, pCol));
  playExplosionSound();
}

function updateAndDrawPlayerCinematic(dt) {
  if (!playerDeathCinematic.active) return;
  playerDeathCinematic.timer += dt;
  const elapsed = playerDeathCinematic.timer;

  ctx.save();
  ctx.globalAlpha = Math.max(0, 1.0 - elapsed / 0.4);
  playerDeathCinematic.shards.forEach(s => {
    s.x += s.vx * (dt * 60);
    s.y += s.vy * (dt * 60);
    s.rot += s.rotSpd * dt;

    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);
    ctx.fillStyle = s.color;
    ctx.fillRect(-s.w / 2, -s.h / 2, s.w, s.h);
    ctx.restore();
  });
  ctx.restore();

  if (elapsed >= 0.4) {
    playerDeathCinematic.active = false;
    setSelectScreenMode();
    gameState = 0;
  }
}

class Bullet {
  constructor(x, y, vx, vy, dmg, radius=4.5, bulletType="DEFAULT", isBlackHoleTrigger=false) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.dmg = dmg; this.radius = radius;
    this.bulletType = bulletType;
    this.isBlackHoleTrigger = isBlackHoleTrigger;
  }
  update(dt) { this.x += this.vx * (dt * 60); this.y += this.vy * (dt * 60); }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);

    if (this.bulletType === "LEGEND") {
      ctx.shadowColor = "#ffd700"; ctx.shadowBlur = 10;
      ctx.fillStyle = "#ffd700";
      ctx.beginPath();
      ctx.moveTo(0, -14); ctx.lineTo(5, 6); ctx.lineTo(0, 3); ctx.lineTo(-5, 6);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(0, -4, 2.5, 0, Math.PI * 2); ctx.fill();

    } else if (this.bulletType === "POWER") {
      ctx.shadowColor = "#ff2244"; ctx.shadowBlur = 10;
      const grad = ctx.createRadialGradient(0, 0, 1, 0, 0, this.radius);
      grad.addColorStop(0, "#ffffff");
      grad.addColorStop(0.3, "#ffe600");
      grad.addColorStop(1, "#ff2244");
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.fill();

    } else if (this.bulletType === "BLACK_HOLE") {
      ctx.shadowColor = "#bf00ff"; ctx.shadowBlur = 12;
      ctx.fillStyle = "#1e0033";
      ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#bf00ff"; ctx.lineWidth = 2.2; ctx.stroke();

    } else if (this.bulletType === "TWIN") {
      ctx.shadowColor = "#00ff66"; ctx.shadowBlur = 8;
      ctx.fillStyle = "#00ff66";
      ctx.beginPath(); ctx.ellipse(0, 0, 3.2, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.ellipse(0, 0, 1.4, 5, 0, Math.PI * 2); ctx.fill();

    } else {
      ctx.shadowColor = "#ffe600"; ctx.shadowBlur = 5;
      ctx.fillStyle = "#ffe600";
      ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

class BossDropItem {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.radius = 16; this.speed = 2.2;
    this.spawnTime = performance.now() / 1000;
    this.startIndex = Math.floor(Math.random() * 3);
  }
 getType(curTime) {
    const elapsed = curTime - this.spawnTime;
    const shift = Math.floor(elapsed / 1.2); // 40% 축소 (1.2초마다 변경)
    const idx = (this.startIndex + shift) % 3;
    return ["P", "M", "D"][idx];
  }
  update(dt) { this.y += this.speed * (dt * 60); }
  draw(curTime) {

    const themeCol = type === "P" ? "#ff0080" : (type === "M" ? "#00f5ff" : "#ffe600");
    const pulseR = this.radius + Math.sin(curTime * 12) * 3;

    ctx.save();
    // 외곽 네온 반짝임 링
    ctx.shadowColor = themeCol;
    ctx.shadowBlur = 12;
    ctx.strokeStyle = themeCol;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(this.x, this.y, pulseR, 0, Math.PI * 2); ctx.stroke();

    // 본체 코어
    ctx.fillStyle = themeCol;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.0; ctx.stroke();

  }}

class Enemy {
  constructor(maxHp, baseSpeed, designId, hasShield=false, isHeavy=false, customX=null) {
    this.originX = (customX !== null) ? customX : (40 + Math.random() * (LOGICAL_WIDTH - 80));
    this.x = this.originX;
    this.y = -40;
    this.vx = 0;
    this.maxHp = maxHp;
    this.hp = maxHp;
    this.speed = isHeavy ? baseSpeed : baseSpeed * (0.75 + Math.random() * 0.7);
    this.patternType = isHeavy ? "STRAIGHT" : ["STRAIGHT", "SINE", "SMOOTH_CURVE", "DIVE", "ZIGZAG"][Math.floor(Math.random() * 5)];
    this.sinePhase = Math.random() * Math.PI * 2;
    this.sineAmp = 55 + Math.random() * 65;
    this.sineFreq = 2.5 + Math.random() * 2.3;
    this.curveVx = (Math.random() < 0.5 ? -1 : 1) * (2.2 + Math.random() * 2.0);
    this.curveTimer = 0.4 + Math.random() * 0.6;
    this.diveTriggered = false;
    this.designId = (designId !== undefined && !isNaN(designId)) ? designId : 0;
    this.radius = isHeavy ? 18 : (maxHp <= 8 ? 20 : (maxHp <= 18 ? 25 : 30));
    this.hasShield = hasShield;
    this.shieldHits = 0;
    this.freezeTimer = 0.0;
    this.isHeavy = isHeavy;
    this.rotDir = Math.random() < 0.5 ? 1 : -1;
    this.colorIdx = Math.floor(Math.random() * 5);
    this.isDead = false;
    this.isBeingSucked = false;
  }
  update(dt, elapsed, speedScale=1.0, widthScale=1.0) {
    if (this.isBeingSucked) return;
    if (this.freezeTimer > 0) {
      this.freezeTimer -= dt;
      this.vx = 0;
      return;
    }

    const effSpeed = this.speed * speedScale;
    const step = dt * 60 * speedScale;
    this.x += this.vx * (dt * 60);
    this.vx *= 0.92;

    if (this.patternType === "DIVE") {
      if (!this.diveTriggered && this.y > 180) { this.diveTriggered = true; this.speed *= 1.8; }
      this.y += effSpeed * (dt * 60);
      this.x += Math.sin(elapsed * 5.0) * (1.5 * step * widthScale);
    } else if (this.patternType === "ZIGZAG") {
      this.y += (effSpeed * 0.9) * (dt * 60);
      this.x += (this.curveVx * widthScale) * step;
      if (this.x <= this.radius + 5 || this.x >= LOGICAL_WIDTH - this.radius - 5) this.curveVx *= -1;
    } else if (this.patternType === "SINE") {
      this.y += effSpeed * (dt * 60);
      this.x = this.originX + Math.sin(elapsed * this.sineFreq + this.sinePhase) * (this.sineAmp * widthScale);
    } else if (this.patternType === "SMOOTH_CURVE") {
      this.y += effSpeed * (dt * 60);
      this.curveTimer -= dt;
      if (this.curveTimer <= 0) { this.curveVx = (Math.random() * 7) - 3.5; this.curveTimer = 0.5 + Math.random() * 0.7; }
      this.x += (this.curveVx * widthScale) * step;
    } else {
      this.y += (effSpeed * 1.15) * (dt * 60);
    }
    this.x = Math.max(this.radius, Math.min(LOGICAL_WIDTH - this.radius, this.x));
  }
  draw(curTime) {
    ctx.save();
    ctx.translate(this.x, this.y);
    drawVectorEnemy(ctx, this.designId, this.isHeavy, this.rotDir, this.colorIdx, curTime);
    ctx.restore();

    if (this.hasShield) {
      ctx.save();
      const isDamaged = (this.shieldHits >= 10);
      if (isDamaged) ctx.globalAlpha = 0.5;
      ctx.strokeStyle = "#00f5ff";
      ctx.lineWidth = 2.0;

      const r = this.radius + 8;
      ctx.beginPath();
      if (!isDamaged) {
        ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
      } else {
        const waveCount = 12;
        for (let i = 0; i <= waveCount; i++) {
          const theta = (i / waveCount) * Math.PI * 2;
          const waveR = r + Math.sin(theta * 6 + curTime * 10) * 3.5;
          const px = this.x + Math.cos(theta) * waveR;
          const py = this.y + Math.sin(theta) * waveR;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
      }
      ctx.stroke();
      ctx.restore();
    } else if (!this.isHeavy) {
      const barW = Math.floor(this.radius * 1.4);
      const hpW = Math.floor(barW * Math.max(0, this.hp / this.maxHp));
      ctx.fillStyle = "#505064";
      ctx.fillRect(this.x - barW / 2, this.y - this.radius - 8, barW, 3);
      ctx.fillStyle = "#32ff78";
      ctx.fillRect(this.x - barW / 2, this.y - this.radius - 8, hpW, 3);
    }
  }
}

function safeKillEnemy(e, customColor="#ffe600") {
  if (!e || e.isDead) return false;
  e.isDead = true;
  e.hp = 0;
  const addScore = e.isHeavy ? 5 : 1;
  score = Math.max(0, Math.floor(score + addScore));

  const isBuffActive = (player && (player.shieldRemain > 0 || player.laserWeaponTimer > 0 || player.clonePlaneTimer > 0));
  const effectiveGauge = isBuffActive ? (CONFIG.BASE_GAUGE_PER_KILL * 0.3) : CONFIG.BASE_GAUGE_PER_KILL;
  skillGauge = Math.min(CONFIG.MAX_SKILL_GAUGE, skillGauge + effectiveGauge);

  // 2. 블랙홀 흡수 시 파괴 파편/폭발 이펙트 완전 배제
  if (!e.isBeingSucked) {
    if (e.isHeavy) rockDebrisList.push(new RockDebrisFX(e.x, e.y));
    else explosions.push(new ExplosionFX(e.x, e.y, customColor));
  }

  const idx = enemies.indexOf(e);
  if (idx !== -1) enemies.splice(idx, 1);
  return true;
}

function applyDamageToEnemy(e, dmg, bType="DEFAULT") {
  hitImpacts.push(new BulletHitImpactFX(e.x, e.y, bType));

  if (e.isHeavy) {
    e.shieldHits = (e.shieldHits || 0) + 1;
    explosions.push(new ExplosionFX(e.x, e.y, "#71717a"));
    playTone(600, 0.05, "sawtooth", -100, 0.08);
    if (e.shieldHits >= 20) {
      safeKillEnemy(e, "#71717a");
    }
    return;
  }

  if (e.hasShield) {
    e.shieldHits++;
    e.freezeTimer = 0.2;
    e.vx = 0;
    explosions.push(new ExplosionFX(e.x, e.y, "#00f5ff"));
    playTone(820, 0.05, "triangle", 0, 0.06);
    if (e.shieldHits >= 20) safeKillEnemy(e);
  } else {
    e.hp -= dmg;
    if (e.hp <= 0) safeKillEnemy(e);
    else explosions.push(new ExplosionFX(e.x, e.y, "#ff007f"));
  }
}

class BossEnemy {
  constructor() {
    this.x = LOGICAL_WIDTH / 2;
    this.y = -80;
    this.targetY = 110;
    this.maxHp = 40;
    this.hp = 40;
    this.radius = 58;
    this.isFullyEntered = false;
    this.vx = 2.0;
    this.lastFireTime = 0.0;
  }
  update(dt, curTime, missiles) {
    if (!this.isFullyEntered) {
      this.y += 1.8 * (dt * 60);
      if (this.y >= this.targetY) { this.y = this.targetY; this.isFullyEntered = true; this.lastFireTime = curTime; }
    } else {
      this.x += this.vx * (dt * 60);
      if (this.x <= this.radius + 15 || this.x >= LOGICAL_WIDTH - this.radius - 15) this.vx *= -1;
      if (curTime - this.lastFireTime >= 3.0) {
        this.lastFireTime = curTime;
        missiles.push(new Bullet(this.x - 22, this.y + 45, -0.6, 5.5, 1, 6, "DEFAULT"));
        missiles.push(new Bullet(this.x + 22, this.y + 45, 0.6, 5.5, 1, 6, "DEFAULT"));
        playTone(300, 0.15, "sawtooth", -150, 0.08);
      }
    }
  }
  draw(curTime) {
    ctx.save();
    ctx.translate(this.x, this.y);
    drawVectorBoss(ctx, curTime);
    ctx.restore();

    const barW = 180;
    const hpW = Math.floor(barW * Math.max(0, this.hp / this.maxHp));
    ctx.fillStyle = "#303045";
    ctx.fillRect(this.x - barW / 2, this.y - this.radius - 18, barW, 6);
    ctx.fillStyle = "#ff2d2d";
    ctx.fillRect(this.x - barW / 2, this.y - this.radius - 18, hpW, 6);
  }
}

let hedgehogLauncher = {

};

function drawHedgehogLauncher(c, curTime) {
  if (!hedgehogLauncher.active) return;
  const wanderX = hedgehogLauncher.x + Math.sin(curTime * 1.8) * 18;
  const wanderY = hedgehogLauncher.y + Math.cos(curTime * 2.4) * 8;

  // 현재 중심 좌표를 nuke 발사점으로 실시간 동기화
  hedgehogLauncher.centerX = wanderX;
  hedgehogLauncher.centerY = wanderY;

  c.save();
  c.translate(wanderX, wanderY);
  c.scale(0.7, 0.7); // 30% 축소

  // 고슴도치 원형 외곽 전체를 둘러싸는 네온 펄스 오라
  const auraPulse = Math.sin(curTime * 16.0) * 4 + 18;
  c.shadowColor = "#00f5ff";
  c.shadowBlur = 16;
  c.strokeStyle = "rgba(0, 245, 255, 0.6)";
  c.lineWidth = 2.0;
  c.beginPath(); c.arc(0, 0, auraPulse + 4, 0, Math.PI * 2); c.stroke();

  const barrelCount = 10;
  for (let i = 0; i < barrelCount; i++) {
    const ang = (-160 + i * (140 / (barrelCount - 1))) * (Math.PI / 180);
    const blen = 22;
    const bx = Math.cos(ang) * blen;
    const by = Math.sin(ang) * blen;

    c.strokeStyle = "#475569";
    c.lineWidth = 3.5;
    c.beginPath();
    c.moveTo(0, 0);
    c.lineTo(bx, by);
    c.stroke();

    c.fillStyle = "#00f5ff";
    c.beginPath();
    c.arc(bx, by, 2, 0, Math.PI * 2);
    c.fill();

    // 팁 부분 펄스
    const chargePulse = Math.sin(curTime * 25.0 + i) * 2 + 3;
    c.fillStyle = (i % 2 === 0) ? "#ffe600" : "#ff007f";
    c.beginPath();
    c.arc(bx, by, chargePulse, 0, Math.PI * 2);
    c.fill();
  }

  // 본체 원형 (외곽 전체 빛남)
  c.fillStyle = "#0f172a";
  c.strokeStyle = "#00f5ff";
  c.lineWidth = 3.0;
  c.beginPath();
  c.arc(0, 0, 18, 0, Math.PI * 2);
  c.fill();
  c.stroke();

  // 중앙 코어
  const pulseR = 7 + Math.sin(curTime * 15.0) * 2.5;
  c.fillStyle = "#ffe600";
  c.beginPath();
  c.arc(0, 0, pulseR, 0, Math.PI * 2);
  c.fill();
  c.restore();
}

function triggerSlotSequence() {
  if (isNukingTransition) return;
  isNukingTransition = true;
  hedgehogLauncher.isExecutingNuke = true;
  hedgehogLauncher.flashAlpha = 1.0;
  hedgehogLauncher.timeStopTimer = 2.0;

  bullets = [];
  bossMissiles = [];
  homingMissiles = [];

  playTone(800, 0.35, "sawtooth", -300, 0.15);

  let validTargets = enemies.filter(e => !e.isDead && e.hp > 0 && e.y >= -20).map(e => ({ type: "ENEMY", obj: e, x: e.x, y: e.y }));
  meteorManager.meteors.filter(m => m.active && m.y >= -20).forEach(m => {
    validTargets.push({ type: "METEOR", obj: m, x: m.x, y: m.y });
  });

  validTargets.sort((a, b) => b.y - a.y);
  const colors = ["#00f5ff", "#ff007f", "#39ff14", "#ffe600", "#bf00ff", "#ff5500", "#ffffff"];

  if (validTargets.length === 0) {
    setTimeout(finishNukeSequence, 1500);
    return;
  }

  const totalFireDuration = 1.0;
  const batchSize = Math.min(4, Math.max(1, Math.ceil(validTargets.length / 8)));
  const totalBatches = Math.ceil(validTargets.length / batchSize);
  const batchInterval = totalFireDuration / totalBatches;

  for (let b = 0; b < totalBatches; b++) {
    const currentBatch = validTargets.slice(b * batchSize, (b + 1) * batchSize);
    setTimeout(() => {
      const now = performance.now() / 1000;
      currentBatch.forEach((tgt, subIdx) => {
        const c = colors[(b * batchSize + subIdx) % colors.length];
        nukeBeamBeams.push({
          sx: hedgehogLauncher.centerX || hedgehogLauncher.x,
          sy: hedgehogLauncher.centerY || hedgehogLauncher.y,
          tx: tgt.x, ty: tgt.y,
          color: c, startTime: now, duration: 0.21
        });
        if (tgt.type === "ENEMY") {
          const e = tgt.obj;
          e.hasShield = false;
          safeKillEnemy(e, c);
        } else if (tgt.type === "METEOR") {
          tgt.obj.active = false;
          explosions.push(new ExplosionFX(tgt.x, tgt.y, "#ff7700"));
          score += 5;
        }

        playTone(950 + ((b + subIdx) % 5) * 80, 0.12, "sawtooth", -350, 0.14);
      });
    }, b * (batchInterval * 1000));
  }

  setTimeout(finishNukeSequence, 1600);
}

function getCanvasCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  if (!rect || rect.width <= 0 || rect.height <= 0) return { x: LOGICAL_WIDTH / 2, y: LOGICAL_HEIGHT / 2 };
  const scaleX = LOGICAL_WIDTH / rect.width;
  const scaleY = LOGICAL_HEIGHT / rect.height;
  const rawX = (clientX - rect.left) * scaleX;
  const rawY = (clientY - rect.top) * scaleY;
  const x = Number.isFinite(rawX) ? Math.max(10, Math.min(LOGICAL_WIDTH - 10, rawX)) : LOGICAL_WIDTH / 2;
  const y = Number.isFinite(rawY) ? Math.max(10, Math.min(LOGICAL_HEIGHT - 10, rawY)) : LOGICAL_HEIGHT / 2;
  return { x, y };
}

const PERIMETER_W = 380;
const PERIMETER_H = 95;
const TOTAL_PERIMETER = (PERIMETER_W + PERIMETER_H) * 2;
const STAR_PALETTE = ["#ffd700", "#00f5ff", "#ff0080", "#32ff78", "#ff8c00", "#c832ff", "#ffffff"];
const ORBIT_STARS = Array.from({ length: 10 }, (_, i) => ({
  dist: Math.random() * TOTAL_PERIMETER,
  size: (5.5 + Math.random() * 2.5) * 1.2,
  speed: TOTAL_PERIMETER / 2.0,
  color: STAR_PALETTE[i % STAR_PALETTE.length]
}));

function getPerimeterPoint(boxX, boxY, dist) {
  let d = ((dist % TOTAL_PERIMETER) + TOTAL_PERIMETER) % TOTAL_PERIMETER;
  if (d < PERIMETER_W) return { x: boxX + d, y: boxY };
  d -= PERIMETER_W;
  if (d < PERIMETER_H) return { x: boxX + PERIMETER_W, y: boxY + d };
  d -= PERIMETER_W;
  if (d < PERIMETER_W) return { x: boxX + PERIMETER_W - d, y: boxY + PERIMETER_H };
  d -= PERIMETER_W;
  return { x: boxX, y: boxY + PERIMETER_H - d };
}

function getWeightedMultiplierItem() {
  const types = [
    { type: "PWR", labelPrefix: "POWER", col: "#ff0080" },
    { type: "MSL", labelPrefix: "MISSILE", col: "#00f5ff" },
    { type: "RATE", labelPrefix: "RATE", col: "#ffe600" }
  ];
  const t = types[Math.floor(Math.random() * types.length)];
  const r = Math.random();
  let val = 1;
  if (r < 0.50) val = 1;
  else if (r < 0.80) val = 2;
  else val = 3;
  return { type: t.type, val: val, label: `${t.labelPrefix} +${val} (x${val})`, col: t.col };
}

function generateWeightedRoulettePool(length = 24) {
  const pool = [];
  for (let i = 0; i < length; i++) {
    let item;
    do { item = getWeightedMultiplierItem(); } 
    while (pool.length > 0 && pool[pool.length - 1].label === item.label);
    pool.push(item);
  }
  return pool;
}
